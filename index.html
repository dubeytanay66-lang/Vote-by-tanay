
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Voting App</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#0f172a;color:white;
 font-family:Arial;
 display:flex;justify-content:center;
}
.app{
 width:100%;max-width:400px;
 background:#1e293b;padding:24px;
 border-radius:20px;text-align:center;
}
h1{color:#38bdf8}
input,button{
 width:100%;padding:14px;
 margin:9px 0;border:0;
 border-radius:10px;font-size:16px;
}
input{background:#334155;color:white}
button{background:#0284c7;color:white;font-weight:bold}
.party{background:#334155}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<h1>🗳️ PARTY VOTING</h1>

<div id="verify">
<p>Enter your details</p>
<input id="username" placeholder="Your name">
<input id="age" type="number" placeholder="Your age">
<button onclick="verifyAge()">Continue</button>
</div>

<div id="rejected" class="hidden">
<h2>❌ Access Denied</h2>
<p>You must be 18 or older.</p>
</div>

<div id="voting" class="hidden">
<h2 id="welcome"></h2>
<p>Choose your favourite:</p>

<button class="party" onclick="vote('Narendra Modi')">
Narendra Modi
</button>

<button class="party" onclick="vote('Yogi Adityanath')">
Yogi Adityanath
</button>

<button class="party" onclick="vote('Tany')">
Tany
</button>

<p id="message"></p>
</div>

<div id="admin" class="hidden">
<h2>📊 Results</h2>
<p id="results"></p>
<button onclick="showResults()">Refresh</button>
</div>
</div>

<script>
let votes=JSON.parse(localStorage.getItem("votes")||
'{"Narendra Modi":0,"Yogi Adityanath":0,"Tany":0}');

function verifyAge(){
 let name=document.getElementById("username").value.trim();
 let age=Number(document.getElementById("age").value);

 if(name.length<2){alert("Enter your name");return}
 if(!Number.isInteger(age)||age<1||age>120){
 alert("Enter valid age");return;
 }

 document.getElementById("verify").classList.add("hidden");

 if(age<18){
 document.getElementById("rejected").classList.remove("hidden");
 return;
 }

 document.getElementById("voting").classList.remove("hidden");
 document.getElementById("welcome").innerText="Welcome "+name+"!";

 if(localStorage.getItem("alreadyVoted")){
 document.getElementById("message").innerText="Already voted!";
 }
}

function vote(party){
 if(localStorage.getItem("alreadyVoted")){
 document.getElementById("message").innerText="Already voted!";
 return;
 }

 votes[party]++;
 localStorage.setItem("votes",JSON.stringify(votes));
 localStorage.setItem("alreadyVoted","yes");

 document.getElementById("message").innerText=
 "✅ Vote submitted for "+party;
}

function showResults(){
 document.getElementById("results").innerHTML=
 Object.entries(votes).map(([name,count])=>
 name+": "+count+" votes"
 ).join("<br><br>");
}

if(location.search.includes("admin=demo")){
 document.getElementById("verify").classList.add("hidden");
 document.getElementById("admin").classList.remove("hidden");
 showResults();
}
</script>
</body>
</html>
